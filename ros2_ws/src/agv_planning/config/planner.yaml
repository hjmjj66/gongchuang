# 路径规划与运动执行配置；参数在启动时读取，修改后需重启节点。
route_planner_node:               # 对应路径规划节点名称
  ros__parameters:                # ROS2 参数配置入口，请保留此层级
    # 地图编号如下，横向与纵向相邻节点均有道路：
    # 7 -- 4 -- 1
    # |    |    |
    # 8 -- 5 -- 2
    # |    |    |
    # 9 -- 6 -- 3
    # 比赛起点和最终停车区统一在agv_mission/config/mission.yaml设置start_area / finish_area。
    # 比赛节点1为启停区1左下角、节点3为启停区3左上角；出入区斜移由mission的parking_offset_mm配置。
    # mission初始化/复位时同步起点，路径节点随后维护当前位置和连续yaw朝向。
    # 独立调试未绑定mission时默认从left（节点1）朝二维码区2启动。
    result_source: REAL           # 比赛规划器固定REAL，mission据此校验执行端来源
    mission_lease_timeout_s: 2.0  # 绑定比赛后调度心跳失效，停止路线；独立调试空身份不检查
    # 各工作区作业时的车头朝向，按上图方向填写 UP / RIGHT / DOWN / LEFT。
    # 二维码区用左侧（+vy）面向地图右方；其余三区用右侧（-vy）面向工作区。
    # UNSET表示未配置；请求终点对齐时，需在此处或请求goal_heading中提供朝向。
    work_heading:                 # 仅终点要求对齐时使用，途中经过工作区不转头
      node_2: DOWN                # 二维码区在地图右方，车头向下，左侧面向二维码
      node_4: LEFT                # 原料区在地图上方，车头向左，右侧面向原料
      node_6: RIGHT               # 粗加工区在地图下方，车头向右，右侧面向粗加工
      node_8: DOWN                # 暂存区在地图左方，车头向下，右侧面向暂存

    # 比赛相邻节点的默认行驶距离；修改后重启路径节点生效。
    # 所有未单独配置 edge_length_mm 的路段均使用此值，连续同向路段按实际边长累加。
    default_edge_length_mm: 850  # 可调，单位：mm，须为正整数，例如改为 1000 即每边 1 m，正常应该是850。838
    # 可选：按实测距离覆盖单条道路长度，单位：mm，须为正整数。
    # 键名固定为“小编号_大编号”，仅支持地图中相邻节点，双向共用同一距离。
    # edge_length_mm:
    #   "2_5": 1180
    #   "6_9": 1220

    require_map_snapshot: true    # true：收到合法地图快照后才接受规划；false：按全通地图调试
    plan_service: /route/plan     # 规划并执行服务，类型：agv_interfaces/srv/PlanRoute
    route_topic: /route/path      # 调试输出：同一条RoutePlan消息包含目标路线和行动链
    blocked_edges_topic: /map/blocked_edges  # 封路地图输入，类型：agv_interfaces/msg/BlockedEdges
    # 里程反馈输入，类型：agv_interfaces/msg/OdometryFeedback；后续由板间通信节点发布。
    # x_m/y_m是本次固定坐标位置（m）；按本段起点与目标方向投影求进度。
    # yaw不能回绕到0～360或±180，否则会影响跨界转动的到达判定。
    odometry_topic: /C/odometry
    board_status_topic: /C/status
    board_status_timeout_s: 0.2
    control_topic: /route/control  # 内部速度与执行状态反馈，类型：agv_interfaces/msg/RouteControl，交给mission转发
    execution_status_topic: /route/execution_status  # 执行状态输出，类型：agv_interfaces/msg/RouteExecutionStatus

    # 车体坐标：vx向前为正、vy向左为正（m/s），角速度逆时针为正（°/s）。
    # x/y位置环覆盖前后、横移、斜移；非行进轴也纠偏，过冲后允许反向修正。
    # 位置环内部单位为m，配置的mm容差会换算为m；v = Kp * 位置误差 + Ki * 误差积分 - Kd * 实测速度。
    # 两轴共用增益但分别积分、独立限幅；换算到当前车体系后再次限制vx/vy。
    translation_pid_kp: 2.0       # 单位：1/s，须大于0；以下为待实车整定的初值
    translation_pid_ki: 0.0       # 单位：1/s²，须非负；0表示暂不启用积分
    translation_pid_kd: 0.1       # 无量纲，须非负
    translation_max_vx_mps: 0.65  # 车体前后速度绝对值上限，单位：m/s，须大于0
    translation_max_vy_mps: 0.35  # 车体左右速度绝对值上限，单位：m/s，须大于0
    translation_arrival_tolerance_mm: 3.0  # 各轴允许误差±此值，单位：mm，可为0，须小于最短边长；两轴和角度均到达才完成

    # 前进、后退、横移、斜移和原地转向共用实时角度环；目标角度使用连续yaw，不作回绕。
    # omega = Kp * 角度误差 + Ki * 误差积分 - Kd * 实测角速度，输出单位：°/s。
    # 以下为待实车整定的初值；Ki=0表示暂不启用积分，输出饱和时限制积分累积。
    angle_pid_kp: 2.0             # 单位：1/s，须大于0
    angle_pid_ki: 0.0             # 单位：1/s²，须非负
    angle_pid_kd: 0.1             # 无量纲，须非负；实测角速度由rad/s换算为°/s
    angle_max_speed_deg_s: 120.0  # PID角速度绝对值上限，单位：°/s，须大于0
    turn_arrival_tolerance_deg: 0.2  # 共用角度允许误差±此值，单位：°，可为0且须小于90；平移还需距离到达

    odometry_timeout_s: 0.5       # 里程反馈最大接收间隔，单位：秒，须大于0；超时停车并中止执行
    motion_progress_timeout_s: 2.0  # 任一未到达位置轴或角度的误差未缩小的最大时长，单位：秒，须大于0；超时停车并中止
    control_rate_hz: 50.0         # 运动控制循环频率，单位：Hz，须大于0
