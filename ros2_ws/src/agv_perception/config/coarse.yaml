# 正式执行端启动时读取，修改后需重启节点；本文件不是 ROS ros__parameters 格式。
# 业务 YAML，由 config 参数读取。保守低速初值，需现场标定；动作号按上位机通信协议v2.0.md（正文 v0.8）。
# 共用运动参数文件；路径相对本 YAML 所在目录解析，也可使用绝对路径。
motion_config: /root/工创/ros2_ws/src/agv_perception/config/work_motion.yaml
coarse:
  # 固定动作号按协议 v2.0 文档正文 v0.8 定义；连续转动/伸缩由伺服参数控制。
  arm:
    # 进入/恢复工作姿态动作号。
    work_pose_cmd: 3
    # 向圆环工位放料动作号。
    place_cmd: 6
    # 粗加工按已记录机构位置取回物料的动作号；不同于原料区抓取。
    pick_cmd: 5
    # 整批完成后的机构收纳动作号。
    stow_cmd: 2
  vision:
    # 圆环检测配置；同时提供共用主相机的采集参数。
    ring_config: /root/工创/ros2_ws/src/agv_perception/config/ring.yaml
    # 物料检测配置；相机设备、宽高须与圆环配置一致。
    material_config: /root/工创/ros2_ws/src/agv_perception/config/material.yaml
    # 正式执行端共用 YOLO 运行库根目录，会覆盖圆环/物料配置中的同名路径。
    model_runtime_path: /root/material_deploy_v1/rdk_model_zoo
    # 圆环对准准心 [u,v]，单位 px；左上角为原点，u 向右、v 向下；[] 使用图像中心。
    target_uv_px:
      [637.2390542625271, 371.6158804156483]
    # 观测最大允许年龄，单位 s；粗加工与暂存须一致。
    max_frame_age_s: 0.5
    # 等待当前视觉阶段首张新图像的上限，单位 s；粗加工与暂存须一致。
    camera_start_timeout_s: 10
  # 1/3 号目标未出现时仅转动机构搜索；1 号正转、3 号反转，底盘保持静止。
  ring_search:
    # 搜索角速度幅值，单位 rad/s，须为正数。
    yaw_rad_s: 0.02
    # 搜索时长，单位 s；角速度 × 时长决定单侧搜索角度。
    duration_s: 0.5
  # 底盘返回 P0（入站角度纠偏后、平移对准 2 号环前的位置）的参数。
  exit_motion:
    # 返回时底盘 x 方向速度上限，单位 m/s。
    max_vx_mps: 0.03
    # 返回时底盘 y 方向速度上限，单位 m/s。
    max_vy_mps: 0.03
    # 当前位置到 P0 的二维欧氏距离容差，单位 m。
    position_tolerance_m: 0.001
    # 里程计 x/y 位置误差共用比例增益，单位 (m/s)/m；输出转为车体速度并限幅。
    kp: 1
    # 返回纠偏上限，单位 s；超时停车并继续流程，不代表已恢复 P0；也用于停车交接超时。
    timeout_s: 15
  # 1/3 号工位的机构绝对预定位点；单个点设 null 可跳过该点预定位。
  # 2 号使用本批工作姿态反馈；必须填写实际脉冲/角度，不能直接填毫米值。
  gantry_presets:
    positions:
      '1':
        # 1 号工位前后轴绝对位置，单位有符号脉冲，来源于实际位置反馈。
        fb_pulses: 4545
        # 1 号工位机构绝对偏航角，单位 rad，沿用反馈坐标系。
        yaw_rad: 0.8538172245025635
      '3':
        # 3 号工位前后轴绝对位置，单位有符号脉冲，来源于实际位置反馈。
        fb_pulses: 2115
        # 3 号工位机构绝对偏航角，单位 rad，沿用反馈坐标系。
        yaw_rad: -0.4385814666748047
  execution:
    # 执行端控制频率，单位 Hz；粗加工/暂存校验要求为 50。
    control_rate_hz: 50.0
    # 输出归零后等待机构/底盘稳定的最短时间，单位 s；还需满足对应的新反馈条件。
    zero_settle_time_s: 0.1
    # 底盘/机构反馈最大允许年龄，单位 s。
    feedback_timeout_s: 0.2
    # 固定动作服务请求等待响应的上限，单位 s；不等于整段动作的执行时长。
    arm_request_timeout_s: 5
    # 执行端租约失联超时，单位 s；原料、粗加工、暂存须一致。
    lease_timeout_s: 1
