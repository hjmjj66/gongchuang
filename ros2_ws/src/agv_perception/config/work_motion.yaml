# 粗加工 / 暂存共用运动参数；原料仅共用gantry_motion，修改后正式节点须重启。
# gantry_motion 用于前往1/3号标定点、粗加工取回；原料保留编辑同步入口，等待时不再返回机构位置。
# 入站/离站时用至少两个圆环中心拟合斜率，控制底盘旋转；暂存只在首次入站纠偏。
angle_alignment:
  # 角度纠偏上限，单位 s，当前校验不得超过 3；超时停止纠偏并继续流程。
  timeout_s: 3.0
  # 目标图像斜率 dv/du，无单位；当前实现与校验仅支持 0（水平）。
  target_slope: 0.0
  # 参与拟合的圆心在 u 方向的最小跨度，单位 px；不足则不计算斜率。
  min_horizontal_span_px: 20.0
  # 允许的绝对斜率上限，无单位；不是弧度或角度值。
  slope_tolerance: 0.05
  # 斜率连续达标的新帧数；之后仍需满足归零稳定时间。
  settle_frames: 3
  # 底盘纠偏角速度上限，单位 rad/s。
  max_wz_rad_s: 0.08
  # 输入为负斜率，输出为底盘角速度 rad/s；增益需按现场响应调节。
  pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 0.3
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
# 仅用底盘平移将 2 号圆环对到准心；u 误差对应 -vx，v 误差对应 +vy。
base_servo:
  # 首次获得目标并开始纠偏后的上限，单位 s；超时归零，停车稳定后继续。
  timeout_s: 3
  # 圆心到准心的二维欧氏距离容差，单位 px。
  tolerance_px: 12
  # 像素误差与底盘停止速度均达标的连续新帧数。
  settle_frames: 2
  # 底盘 x 方向平移速度上限，单位 m/s。
  max_vx_mps: 0.05
  # 底盘 y 方向平移速度上限，单位 m/s。
  max_vy_mps: 0.05
  # 底盘二维线速度模长的停车门槛，单位 m/s；也用于记录 P0 和退出确认。
  stop_speed_mps: 0.01
  # 水平像素误差 PID，输出取负后作为底盘 vx；比例增益单位 (m/s)/px。
  u_pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 0.002
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
  # 垂直像素误差 PID，输出作为底盘 vy；比例增益单位 (m/s)/px。
  v_pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 0.002
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
# 圆环放料与暂存码垛共用的机构视觉伺服；底盘固定，u 控偏航、v 控前后轴，均取负输出。
gantry_servo:
  # 首次获得目标并开始纠偏后的上限，单位 s；超时停轴并继续动作，未确认对准。
  timeout_s: 3
  # 目标中心到对应准心的二维欧氏距离容差，单位 px。
  tolerance_px: 8
  # 像素误差及两轴输出同时达标的连续新帧数；当前校验固定要求为 4。
  qualified_frames: 4
  # 机构偏航角速度上限，单位 rad/s。
  max_yaw_rad_s: 0.4
  # 机构前后轴转速上限，单位 rpm。
  max_fb_rpm: 15
  # 判定对准时允许的偏航输出幅值上限，单位 rad/s；不是角度误差。
  small_yaw_rad_s: 0.005
  # 判定对准时允许的前后轴输出幅值上限，单位 rpm；不是脉冲误差。
  small_fb_rpm: 0.2
  # 水平像素误差到机构偏航速度的 PID；比例增益单位 (rad/s)/px。
  u_pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 0.01
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
  # 垂直像素误差到前后轴转速的 PID；比例增益单位 rpm/px。
  v_pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 0.2
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
# 按机构实际位置反馈预定位/返回；原料区只从本文件加载此组，其视觉伺服使用 raw.yaml。
gantry_motion:
  # 前后轴绝对位置误差容差，单位脉冲。
  length_tolerance_pulses: 10
  # 机构偏航绝对角误差容差，单位 rad；按直接角度差计算，不做环绕归一化。
  angle_tolerance_rad: 0.08
  # 位置反馈 PID 的机构偏航速度上限，单位 rad/s。
  max_yaw_rad_s: 5
  # 位置反馈 PID 的前后轴转速上限，单位 rpm。
  max_fb_rpm: 30
  # 预定位/返回纠偏上限，单位 s；超时停轴并继续流程，不代表位置已达标。
  timeout_s: 3
  # 目标偏航角 - 当前偏航角的 PID；比例增益单位 (rad/s)/rad。
  yaw_pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 5
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
  # 目标脉冲 - 当前脉冲的 PID；比例增益单位 rpm/脉冲。
  length_pid:
    # 比例增益；误差越大输出越大，最终受所在组速度上限限幅。
    kp: 0.06
    # 积分增益；0 关闭积分项，积分按秒累计。
    ki: 0.0
    # 微分增益；0 关闭微分项，误差变化率按秒计算。
    kd: 0.0
